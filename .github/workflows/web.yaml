name: Web pipeline
on:
  push:
    branches: ['master']
    tags: ['**']
  pull_request:
    branches: ['**']
jobs:
  # ============================================================================
  # Setup the mappings for all the subsequent jobs.
  # ============================================================================
  mappings:
    name: Generate mappings
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.mappings.outputs.environment }}
      url: ${{ steps.mappings.outputs.url }}
      semver: ${{ steps.mappings.outputs.semver }}
      image: ${{ steps.mappings.outputs.image }}
      image_exists: ${{ steps.mappings.outputs.image_exists }}
      skip_lint: ${{ steps.mappings.outputs.skip_lint }}
      skip_test: ${{ steps.mappings.outputs.skip_test }}
      skip_build: ${{ steps.mappings.outputs.skip_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.2.0
        with:
          version: local
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Setup mappings
        id: mappings
        run: .github/scripts/setup.sh
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/scripts/version_check.sh
      - name: Debug mappings
        run: echo "$MAPPINGS" | jq -C .
        env:
          MAPPINGS: ${{ toJson(steps.mappings.outputs) }}

  # ============================================================================
  # Build the Docker image
  # ============================================================================
  docker:
    name: Build Docker image
    needs: [mappings]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.mappings.outputs.skip_build != '1'
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.2.0
        with:
          version: local
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
          configure-docker: true
      - name: Build
        if: needs.mappings.outputs.skip_build != '1'
        run: |
          npm install
          npm run build
      - name: Build Docker image
        if: needs.mappings.outputs.skip_build != '1'
        run: |
          docker build \
            --build-arg "RELEASE=${{ needs.mappings.outputs.semver }}" \
            --tag ${{ needs.mappings.outputs.image }} \
            .
      - name: Push Docker image to Google Cloud Container Registry
        if: needs.mappings.outputs.skip_build != '1'
        run: docker push ${{ needs.mappings.outputs.image }}